name: 課後備課任務自動建立

on:
  schedule:
    # 每天台灣時間 22:05（UTC 14:05）
    - cron: "5 14 * * *"
  workflow_dispatch: # 允許手動觸發

jobs:
  auto-prep-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run auto prep task script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TASK_DB_ID: ${{ secrets.TASK_DB_ID }}
          DR_DB_ID: ${{ secrets.DR_DB_ID }}
          CANINE_LAB_DB_ID: ${{ secrets.CANINE_LAB_DB_ID }}
        run: python3 scripts/auto_prep_task.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/prep_task_state.json
          git diff --staged --quiet || git commit -m "chore: update prep task state [skip ci]"
          git push
